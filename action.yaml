name: 'Discord Notifier'

description: 'Send message notifications to Discord'

inputs:
    webhookUrl:
        description: 'Discord Webhook URL'
        required: true
    projectName:
        description: 'Name of the project'
        required: true
    needs:
        description: 'JSON-encoded needs context of the calling job, pass the toJson(needs) expression. The overall status and the list of failed jobs are derived from it.'
        required: true
    onlyHeadCommit:
        description: 'If true, show only the head commit instead of every commit of the push. Only applies to push events.'
        required: false
        default: 'false'
    commitOrder:
        description: 'Order of the commit list: newest-first or oldest-first.'
        required: false
        default: 'newest-first'
    showCommitDates:
        description: 'If true, add the ISO date of each commit to the commit list.'
        required: false
        default: 'false'
    fields:
        description: 'Extra embed fields, one `Name: value` per line. Values support Discord markdown. Indented lines continue the previous value. Fields with an empty value are dropped.'
        required: false
    inlineFields:
        description: 'If true, render the extra fields inline, in up to three columns.'
        required: false
        default: 'false'
    username:
        description: 'Username to display in the message'
        required: false
    avatarUrl:
        description: 'URL to the avatar image'
        required: false

runs:
    using: 'node24'
    main: 'dist/main.js'
