name: Check dist

# The action runs `dist/main.js` directly from the repo, so the committed
# bundle must always match the current `src/`. This fails the build if it drifts.

on:
    pull_request:
        paths:
            - 'src/**'
            - 'dist/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'esbuild.js'
            - 'tsconfig.json'
            - '.oxlintrc.json'
            - '.oxfmtrc.json'
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    check-dist:
        name: Verify dist is up to date
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm fmt:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Rebuild dist
              run: pnpm build

            - name: Compare committed dist with fresh build
              run: |
                  if ! git diff --quiet dist; then
                    echo "::error::Committed dist/ is out of date. Run 'pnpm build' and commit the result."
                    git diff --stat dist
                    exit 1
                  fi
